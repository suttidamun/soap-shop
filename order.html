<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>สั่งซื้อ | Toothgate</title>
  <meta name="description" content="สั่งซื้อยาสีฟัน Toothgate">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">TOOTHGATE</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="section">
      <div class="container">
        <div class="section-header">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider">
        </div>

        <form id="orderForm" class="form-wrap">

          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" readonly>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" readonly>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" placeholder="เช่น ที่อยู่จัดส่ง หรือช่วงเวลาที่สะดวกรับสินค้า"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
          </div>

        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">TOOTHGATE</span>
      <p>© 2026 Toothgate. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
